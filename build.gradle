plugins {
    id 'net.neoforged.moddev' version '2.0.42-beta'
}

version = project.version
group = project.group

base {
    archivesName = "nemos-backpacks-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neoforge_version

    parchment {
        minecraftVersion = project.parchment_minecraft
        mappingsVersion = project.parchment_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    var replaceProperties = [
        minecraft_version: project.minecraft_version,
        minecraft_version_range: project.minecraft_version_range,
        neoforge_version: project.neoforge_version,
        neoforge_loader_version_range: project.neoforge_loader_version_range,
        mod_id: project.mod_id,
        mod_name: project.mod_name,
        mod_author: project.mod_author,
        version: project.version,
        license: project.license,
        description: project.description,
        credits: project.credits,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}
