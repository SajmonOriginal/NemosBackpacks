name: Publish

# Build Sajmon's NeoForge 1.21.1 port of Nemo's Backpacks and publish the
# jar to maven.sajmon.gg + attach to a GitHub Release. Only fires on the
# version/1.21.1 branch — the upstream master branch (26.1 Fabric) is left
# alone since publishing rights are scoped to the 1.21.1 port per the
# author's permission (see README).

on:
  push:
    branches: ['version/1.21.1']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: ver
        run: |
          VERSION=$(awk -F '=' '/^version[[:space:]]*=/ { print $2; exit }' gradle.properties | tr -d ' \r')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and publish to Maven
        env:
          MOD_VERSION: ${{ steps.ver.outputs.version }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
        run: ./gradlew build publishMavenJavaPublicationToSajmonRepository --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: nemos-backpacks-neoforge ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            build/libs/*.jar
